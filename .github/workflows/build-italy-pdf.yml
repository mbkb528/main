name: Build Italy Trip PDF
on:
  push:
    paths:
      - 'italy-trip/build_pdf.py'
      - '.github/workflows/build-italy-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab pillow requests
      - run: python italy-trip/build_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: italy-trip-pdf
          path: italy_trip_2026.pdf
          if-no-files-found: error
